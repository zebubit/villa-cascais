<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Cascais — Brevemente em Uberaba</title>
<meta property="og:title" content="Villa Cascais — Brevemente em Uberaba">
<meta property="og:description" content="Um pedaço de Portugal em Uberaba. Em breve, de portas abertas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080603;
  --gold:#B8943F; --gold-l:#E8D5A0; --gold-d:#7A590F;
  --cream:#F5EDD8; --muted:rgba(245,237,216,.5);
  --wood-dark:#1A0C04; --wood-mid:#3A1E0C; --wood-hi:#6B3A1F;
  --serif:'Cormorant Garamond',serif;
  --sans:'Inter',sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--sans);color:var(--cream);position:relative;}

/* ──────── FUNDO ──────── */
.bg{
  position:fixed;inset:0;z-index:0;
  background:url('CAPA.webp') center/cover no-repeat;
  filter:brightness(.18) saturate(.6);
  transform:scale(1.04);
}
.bg-vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 85% 85% at 50% 50%,transparent 20%,rgba(8,6,3,.88) 100%);
}

/* ──────── PARTÍCULAS ──────── */
.dust{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.dp{position:absolute;border-radius:50%;background:rgba(184,148,63,.3);}

/* ──────── FLASH OVERLAY (ao entrar) ──────── */
.flash{
  position:fixed;inset:0;z-index:900;
  background:radial-gradient(ellipse at center,#FFF8EC,#E8C97A 60%,#8B5E10);
  opacity:0;pointer-events:none;
  transition:opacity .4s ease;
}
.flash.on{opacity:1;}

/* ──────── STAGE ──────── */
.stage{
  position:relative;z-index:10;
  width:100%;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}

/* ──────── BRAND ACIMA ──────── */
.brand{
  text-align:center;margin-bottom:clamp(16px,2.5vh,32px);
  animation:fadeDown .9s ease forwards;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.brand-city{
  font-size:.6rem;letter-spacing:.38em;text-transform:uppercase;
  color:rgba(184,148,63,.55);margin-bottom:9px;
}
.brand-name{
  font-family:var(--serif);font-size:clamp(2.2rem,4.5vw,4rem);
  font-weight:300;letter-spacing:.14em;line-height:1;color:var(--cream);
}
.brand-name em{font-style:italic;color:var(--gold-l);}

/* ──────── PORTA GRANDE ──────── */
.door-wrap{
  position:relative;
  perspective:1600px;
  /* zoom saindo daqui */
  transform-origin:center center;
}
/* Caixa / batente */
.door-frame{
  width:clamp(240px,34vw,460px);
  height:clamp(400px,65vh,700px);
  position:relative;
  background:#11090302;
  border:3px solid var(--gold-d);
  border-radius:50% 50% 0 0/14% 14% 0 0;
  /* sombra de nicho na parede */
  box-shadow:
    0 0 0 10px rgba(8,6,3,.9),
    0 0 0 12px rgba(139,94,16,.2),
    inset 0 0 60px rgba(0,0,0,.9),
    0 60px 160px rgba(0,0,0,.95),
    0 0 80px rgba(0,0,0,.6);
  overflow:hidden;
  cursor:pointer;
  /* anel dourado decorativo */
}
/* anel externo arco */
.door-frame::before{
  content:'';position:absolute;inset:8px;z-index:30;pointer-events:none;
  border:1px solid rgba(184,148,63,.18);
  border-radius:46% 46% 0 0/13% 13% 0 0;
}

/* ──── CENA INTERIOR (visível quando abre) ──── */
.door-interior{
  position:absolute;inset:0;z-index:2;overflow:hidden;border-radius:inherit;
}
.di-bg{
  position:absolute;inset:0;
  background:url('CAPA2.webp') center/cover no-repeat;
  filter:brightness(.4) blur(3px);
  transform:scale(1.08);
}
.di-glow{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 100%,rgba(184,148,63,.2),transparent 65%);
}

/* ──── FOLHA DA PORTA ──── */
.door-leaf{
  position:absolute;inset:0;z-index:10;
  transform-origin:center center;
  transform-style:preserve-3d;
  border-radius:inherit;
  overflow:hidden;
  /* Textura de madeira escura */
  background:
    linear-gradient(170deg,
      #5C3420 0%,#3A1E0C 20%,
      #2A1408 50%,#3A1E0C 80%,
      #5C3420 100%);
  /* Veios horizontais */
  box-shadow:inset 0 0 80px rgba(0,0,0,.55);
}
/* veios da madeira */
.door-leaf::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,transparent 16px,
      rgba(0,0,0,.06) 16px,rgba(0,0,0,.06) 17px
    ),
    repeating-linear-gradient(
      91deg,
      transparent 0,transparent 80px,
      rgba(255,255,255,.012) 80px,rgba(255,255,255,.012) 82px
    );
}
/* bevel nas bordas */
.door-leaf::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to right,rgba(255,255,255,.04) 0%,transparent 8%,transparent 92%,rgba(0,0,0,.3) 100%),
    linear-gradient(to bottom,rgba(255,255,255,.05) 0%,transparent 5%);
}

/* Painéis internos (4 retângulos dourados) */
.panel{
  position:absolute;border:1.5px solid rgba(184,148,63,.22);
  background:rgba(0,0,0,.15);
  pointer-events:none;z-index:11;
}
/* Painel topo-esquerda */
.p1{top:12%;left:8%;width:37%;height:28%;border-radius:30% 30% 0 0 / 12% 12% 0 0;}
/* Painel topo-direita */
.p2{top:12%;right:8%;width:37%;height:28%;border-radius:30% 30% 0 0 / 12% 12% 0 0;}
/* Painel baixo-esquerda */
.p3{top:46%;left:8%;width:37%;height:34%;}
/* Painel baixo-direita */
.p4{top:46%;right:8%;width:37%;height:34%;}
.panel::after{content:'';position:absolute;inset:3px;border:1px solid rgba(184,148,63,.08);}

/* Dobradiças */
.hinge{
  position:absolute;left:-1px;width:14px;border-radius:0 3px 3px 0;
  background:linear-gradient(to right,#7A590F,#B8943F,#7A590F);
  box-shadow:2px 0 8px rgba(0,0,0,.5);z-index:15;
}
.h1{top:9%;height:32px;} .h2{top:46%;height:32px;} .h3{bottom:9%;height:32px;}

/* Maçaneta */
.handle-group{
  position:absolute;right:clamp(14px,5%,22px);top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:5px;z-index:15;
}
.h-rod{width:5px;height:clamp(22px,3.5vh,36px);background:linear-gradient(to bottom,#C9A84C,#8B6914);border-radius:3px;}
.h-ball{
  width:clamp(18px,2.8vh,26px);height:clamp(18px,2.8vh,26px);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#EED87A,#B8943F 45%,#6B4410);
  box-shadow:0 2px 10px rgba(0,0,0,.7),0 0 16px rgba(184,148,63,.25);
  transition:box-shadow .35s;
}
.door-frame:hover .h-ball{box-shadow:0 2px 10px rgba(0,0,0,.7),0 0 28px rgba(232,213,160,.6);}

/* Placa de latão */
.plate{
  position:absolute;bottom:12%;left:50%;transform:translateX(-50%);z-index:15;
  background:linear-gradient(135deg,#D4A843,#8B6914);
  padding:5px 14px;border-radius:2px;
  font-family:var(--sans);font-size:.44rem;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;color:#1A0802;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.6);
}

/* ──────── KEYHOLE ──────── */
.keyhole{
  position:absolute;right:clamp(12px,4%,18px);top:calc(50% + clamp(30px,4.5vh,50px));
  z-index:15;display:flex;flex-direction:column;align-items:center;gap:0;
}
.kh-circle{width:8px;height:8px;border-radius:50%;background:#0A0602;border:1px solid rgba(184,148,63,.4);}
.kh-slot{width:4px;height:10px;background:#0A0602;border:1px solid rgba(184,148,63,.25);border-top:none;border-radius:0 0 2px 2px;}

/* ──────── HINT ──────── */
.hint{
  margin-top:clamp(12px,2vh,24px);text-align:center;
  animation:hPulse 3.2s ease-in-out infinite;
}
@keyframes hPulse{0%,100%{opacity:.6}50%{opacity:1}}
.hint-main{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(.9rem,2vw,1.15rem);
  color:var(--gold-l);letter-spacing:.06em;
  display:flex;align-items:center;gap:12px;justify-content:center;
  margin-bottom:5px;
}
.arr{display:inline-block;width:30px;height:1px;background:var(--gold);position:relative;}
.arr::after{content:'';position:absolute;right:-1px;top:-3px;width:6px;height:6px;border-right:1px solid var(--gold);border-top:1px solid var(--gold);transform:rotate(45deg);}
.hint-sub{font-size:.57rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(184,148,63,.4);}

/* ──────── ZOOM DE ENTRADA ──────── */
@keyframes zoomEnter{
  0%  {transform:scale(1);opacity:1;}
  70% {transform:scale(14);opacity:.9;}
  100%{transform:scale(28);opacity:0;}
}
.door-wrap.entering{
  animation:zoomEnter 1.1s cubic-bezier(.55,0,1,.45) forwards;
  pointer-events:none;
}
/* some a hint */
.hint.hidden{opacity:0!important;transition:opacity .2s;}
.brand.hidden{opacity:0!important;transition:opacity .3s;}

/* ──────── LOGO CANTO ──────── */
.logo-c{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:50;display:flex;align-items:center;gap:9px;opacity:.3;
  transition:opacity .3s;
}
.logo-c:hover{opacity:.65;}
.logo-c img{width:32px;height:32px;object-fit:contain;filter:brightness(3) saturate(0);}
.logo-c span{font-family:var(--serif);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);}

/* Borda dourada inferior */
.deco{position:fixed;bottom:0;left:0;right:0;height:2px;z-index:50;
background:linear-gradient(90deg,transparent,var(--gold-d),var(--gold),var(--gold-d),transparent);opacity:.4;}
</style>
</head>
<body>

<div class="bg" id="bgEl"></div>
<div class="bg-vignette"></div>
<div class="dust" id="dust"></div>
<div class="flash" id="flash"></div>

<div class="stage">

  <!-- Nome -->
  <div class="brand" id="brand">
    <div class="brand-city">Uberaba · Minas Gerais</div>
    <div class="brand-name">Villa <em>Cascais</em></div>
  </div>

  <!-- Porta -->
  <div class="door-wrap" id="doorWrap">
    <div class="door-frame" id="doorFrame">

      <!-- Interior (atrás da porta) -->
      <div class="door-interior">
        <div class="di-bg"></div>
        <div class="di-glow"></div>
      </div>

      <!-- Folha -->
      <div class="door-leaf" id="doorLeaf">
        <div class="panel p1"></div>
        <div class="panel p2"></div>
        <div class="panel p3"></div>
        <div class="panel p4"></div>
        <div class="hinge h1"></div>
        <div class="hinge h2"></div>
        <div class="hinge h3"></div>
        <div class="handle-group">
          <div class="h-rod"></div>
          <div class="h-ball" id="knob"></div>
          <div class="h-rod"></div>
        </div>
        <div class="keyhole"><div class="kh-circle"></div><div class="kh-slot"></div></div>
        <div class="plate">Villa Cascais</div>
      </div>

    </div>
  </div>

  <!-- Hint -->
  <div class="hint" id="hint">
    <div class="hint-main">
      <span class="arr"></span>
      Abra a porta
      <span class="arr" style="transform:scaleX(-1)"></span>
    </div>
    <div class="hint-sub">Dê uma espiadinha</div>
  </div>

</div>

<div class="logo-c">
  <img src="LOGO1.webp" alt="Villa Cascais">
  <span>Villa Cascais</span>
</div>
<div class="deco"></div>

<script>
/* Partículas */
(()=>{
  const c=document.getElementById('dust');
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='dp';
    const s=Math.random()*3+1;
    d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;
    bottom:${Math.random()*40}%;opacity:${Math.random()*.35+.05};
    animation:dustFloat ${13+Math.random()*18}s ${-Math.random()*20}s linear infinite;
    --dx:${(Math.random()-.5)*70}px;`;
    c.appendChild(d);
  }
})();

/* Maçaneta brilha periodicamente */
const knob=document.getElementById('knob');
setInterval(()=>{
  knob.style.boxShadow='0 2px 10px rgba(0,0,0,.7),0 0 32px rgba(232,213,160,.7)';
  setTimeout(()=>{knob.style.boxShadow='';},700);
},2800);

/* Micro-abertura no hover */
const leaf=document.getElementById('doorLeaf');
const frame=document.getElementById('doorFrame');
let opened=false;
leaf.addEventListener('mouseenter',()=>{
  if(opened)return;
  leaf.style.cssText='transition:transform .4s ease;transform:perspective(1600px) rotateY(-5deg);';
});
leaf.addEventListener('mouseleave',()=>{
  if(opened)return;
  leaf.style.cssText='transition:transform .35s ease;transform:perspective(1600px) rotateY(0deg);';
});
leaf.addEventListener('mousemove',e=>{
  if(opened)return;
  const r=leaf.getBoundingClientRect();
  const y=(e.clientY-r.top)/r.height-.5;
  leaf.style.transform=`perspective(1600px) rotateY(-5deg) rotateX(${y*3}deg)`;
});

/* ── ENTRAR ── */
function enter(){
  if(opened)return;
  opened=true;

  /* Esconde hint e brand */
  document.getElementById('hint').classList.add('hidden');
  document.getElementById('brand').classList.add('hidden');

  /* Reseta hover da folha */
  leaf.style.cssText='';

  /* Flash de luz quente */
  const fl=document.getElementById('flash');
  setTimeout(()=>{fl.classList.add('on');},550);
  setTimeout(()=>{fl.classList.remove('on');},950);

  /* Zoom da porta */
  const wrap=document.getElementById('doorWrap');
  wrap.classList.add('entering');

  /* Redireciona para o site */
  setTimeout(()=>{
    window.location.href='index.html';
  },1050);
}

frame.addEventListener('click',enter);
frame.addEventListener('touchstart',e=>{e.preventDefault();enter();},{passive:false});
document.addEventListener('keydown',e=>{
  if(!opened&&(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'))enter();
});
</script>

<style>
@keyframes dustFloat{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  15%{opacity:1;}
  85%{opacity:.5;}
  100%{transform:translateY(-100vh) translateX(var(--dx));opacity:0;}
}
</style>
</body>
</html>
